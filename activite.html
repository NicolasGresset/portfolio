        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ======= NAVIGATION ======= -->
    <nav class="nav" aria-label="Navigation principale">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">ngb.</a>
            <button class="nav-toggle" aria-label="Ouvrir le menu de navigation" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links" role="list">
                <li><a href="projects.html">projets</a></li>
                <li><a href="blog.html">blog</a></li>

                <li><a href="index.html#publications">publications</a></li>

        </div>
    </nav>

    <!-- ======= PAGE HEADER ======= -->
    <header class="page-header">
        <div class="container">
            <a href="sport.html" class="article-back">&larr; sport</a>
            <p class="page-header-label" id="activity-date">// sortie</p>
            <h1 class="page-header-title" id="activity-name">Chargement…</h1>
            <p class="activity-label" id="activity-label"></p>
            <p class="activity-description" id="activity-description" hidden></p>
        </div>
    </header>

    <!-- ======= ACTIVITY DETAIL ======= -->
    <main>
        <div class="container" style="padding-bottom: 5rem;">
            <div class="activity-stats activity-stats--wide" id="activity-stats"></div>

            <section class="chart-card" aria-label="Allure et fréquence cardiaque" style="margin-top: 2rem;">
                <div class="chart-header">
                    <h2 class="chart-title">Allure &amp; fréquence cardiaque</h2>
                    <p class="chart-readout" id="chart-readout" aria-live="polite"></p>
                </div>
                <p class="chart-subtitle">allure (min/km)</p>
                <div class="chart-plot chart-plot--line" id="pace-chart"></div>
                <p class="chart-subtitle">fréquence cardiaque (bpm)</p>
                <div class="chart-plot chart-plot--line" id="hr-chart"></div>
            </section>

            <h2 class="section-label" style="margin: 3rem 0 1.25rem;">// intervalles détectés</h2>
            <ol class="segment-list" id="segment-list"></ol>
        </div>
    </main>

    <!-- ======= FOOTER ======= -->
    <footer class="footer">
        <div class="footer-inner">
