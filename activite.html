<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Détail d'une sortie course à pied : allure, fréquence cardiaque et intervalles détectés.">
    <title>Sortie — Nicolas Gresset-Bourgeois</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/sport.css">
</head>

<body>

    <!-- ======= NAVIGATION ======= -->
    <nav class="nav" aria-label="Navigation principale"></nav>

    <!-- ======= PAGE HEADER ======= -->
    <header class="page-header">
        <div class="container">
            <a href="sport" class="article-back">&larr; sport</a>
            <p class="page-header-label" id="activity-date">// sortie</p>
            <h1 class="page-header-title" id="activity-name">Chargement…</h1>
            <p class="activity-label" id="activity-label"></p>
            <p class="activity-description" id="activity-description" hidden></p>
        </div>
    </header>

    <!-- ======= ACTIVITY DETAIL ======= -->
    <main>
        <div class="container page-main">
            <div class="activity-stats activity-stats--wide" id="activity-stats"></div>

            <section class="chart-card activity-charts" aria-label="Allure et fréquence cardiaque">
                <div class="chart-header">
                    <h2 class="chart-title">Allure &amp; fréquence cardiaque</h2>
                    <p class="chart-readout" id="chart-readout" aria-live="polite"></p>
                </div>
                <p class="chart-subtitle">allure (min/km)</p>
                <div class="chart-plot chart-plot--line" id="pace-chart"></div>
                <p class="chart-subtitle">fréquence cardiaque (bpm)</p>
                <div class="chart-plot chart-plot--line" id="hr-chart"></div>
            </section>

            <h2 class="section-label section-label--spaced">// intervalles détectés</h2>
            <ol class="segment-list" id="segment-list"></ol>
        </div>
    </main>

    <!-- ======= FOOTER ======= -->
    <footer class="footer"></footer>

    <script src="js/layout.js"></script>
    <script type="module" src="js/activity.js"></script>
</body>

</html>
