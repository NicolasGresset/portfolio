<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Journal sportif de Nicolas Gresset-Bourgeois — dernières sorties course et vélo.">
    <title>Sport — Nicolas Gresset-Bourgeois</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/sport.css">
</head>

<body>

    <!-- ======= NAVIGATION ======= -->
    <nav class="nav" aria-label="Navigation principale"></nav>

    <!-- ======= PAGE HEADER ======= -->
    <header class="page-header">
        <div class="container">
            <p class="page-header-label">// journal de bord</p>
            <h1 class="page-header-title">Sport</h1>
            <p class="page-header-intro">
                Dernières sorties course &amp; vélo &mdash; retrouvez-moi sur
                <a href="https://www.strava.com/athletes/124828413" target="_blank" rel="noopener noreferrer">
                    Strava ↗
                </a>
            </p>
        </div>
    </header>

    <!-- ======= STRAVA ACTIVITIES ======= -->
    <main>
        <div class="container page-main">
            <section class="chart-card" aria-labelledby="weekly-distance-title">
                <div class="chart-header">
                    <h2 class="chart-title" id="weekly-distance-title">Course à pied &mdash; km par semaine</h2>
                    <ul class="chart-legend" aria-label="Légende">
                        <li><span class="chart-swatch chart-swatch--easy"></span>endurance</li>
                        <li><span class="chart-swatch chart-swatch--quality"></span>qualité</li>
                    </ul>
                </div>
                <div class="chart-plot" id="weekly-distance-chart">
                    <p class="activities-status">Chargement…</p>
                </div>
            </section>

            <h2 class="section-label section-label--spaced">// dernières sorties</h2>
            <div class="activities-grid" id="activities-grid">
                <p class="activities-status">Chargement des activités…</p>
            </div>
        </div>
    </main>

    <!-- ======= FOOTER ======= -->
    <footer class="footer"></footer>

    <script src="js/layout.js"></script>
    <script type="module" src="js/sport.js"></script>
    <script type="module" src="js/weekly-distance.js"></script>
</body>

</html>
