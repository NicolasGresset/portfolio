<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Blog de Nicolas Gresset-Bourgeois — notes sur la recherche, la tech, la culture.">
    <title>Blog — Nicolas Gresset-Bourgeois</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ======= NAVIGATION ======= -->
<nav class="nav" aria-label="Navigation principale">
    <div class="nav-inner">
        <a href="index.html" class="nav-logo">ngb.</a>
        <button class="nav-toggle" aria-label="Ouvrir le menu de navigation" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <ul class="nav-links" role="list">
            <li><a href="projects.html">projets</a></li>
            <li><a href="blog.html">blog</a></li>
            <li><a href="cinema.html">cinéma</a></li>
            <li><a href="index.html#publications">publications</a></li>
        </ul>
    </div>
</nav>

<!-- ======= PAGE HEADER ======= -->
<header class="page-header">
    <div class="container">
        <p class="page-header-label">// notes</p>
        <h1 class="page-header-title">Blog</h1>
    </div>
</header>

<!-- ======= BLOG LIST ======= -->
<main>
    <div class="container" style="padding-bottom: 5rem;">

        <div class="blog-full-list" id="blog-full-list" aria-label="Liste des articles"></div>

    </div>
</main>

<!-- ======= FOOTER ======= -->
<footer class="footer">
    <div class="footer-inner">
        <span class="footer-text">© 2025 Nicolas Gresset-Bourgeois</span>
        <span class="footer-text">Toulouse, France</span>
    </div>
</footer>

<script src="js/nav.js"></script>
<script>
    fetch('data/posts.json')
        .then(r => r.json())
        .then(posts => {
            const list = document.getElementById('blog-full-list');
            if (!posts.length) {
                list.innerHTML = '<p style="font-family:var(--font-mono);font-size:0.85rem;color:var(--color-text-muted)">Aucun article pour le moment.</p>';
                return;
            }
            list.innerHTML = posts.map(p => `
                <a href="blog/${p.slug}.html" class="blog-full-item">
                    <div class="blog-full-item-header">
                        <span class="blog-full-item-date">${p.dateLabel}</span>
                        <div class="project-tags" style="margin:0">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
                    </div>
                    <p class="blog-full-item-title">${p.title}</p>
                    <p class="blog-full-item-excerpt">${p.excerpt}</p>
                </a>`).join('');
        });
</script>
</body>
</html>
